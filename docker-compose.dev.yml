# =============================================================
# docker-compose.dev.yml  —  OVERRIDE PER SVILUPPO LOCALE
# NON usare in produzione. NON caricare su Portainer.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# oppure (equivalente):
#   .\setup.ps1 run-dev
# =============================================================

services:

  app:
    # Override del comando: aggiunge --reload e punta al volume montato
    command: >
      python -m uvicorn app.app:app
      --host 0.0.0.0
      --port 8000
      --loop asyncio
      --reload
      --reload-dir /app/app
      --log-level debug
    volumes:
      # Monta il codice sorgente locale → auto-reload funziona
      - ./app:/app/app
      - ./data:/app/data
