# =============================================================
# docker-compose.yml  —  PRODUZIONE
# Usato da Portainer e da: .\setup.ps1 run
#
# Per sviluppo locale (auto-reload + volume mount) usa invece:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# oppure semplicemente:
#   .\setup.ps1 run-dev
# =============================================================

services:

  app:
    build: .
    image: fastzoom-app:latest
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    working_dir: /app
    # Produzione: nessun --reload, nessun volume mount del codice sorgente.
    # Il codice è baked nell'immagine via COPY . . nel Dockerfile.
    command: >
      python -m uvicorn app.app:app
      --host 0.0.0.0
      --port 8000
      --loop asyncio
      --workers 1
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/archaeological_catalog.db
      MINIO_CONFIG_PROFILE: local
      MINIO_LOCAL_URL: http://minio:9000
      MINIO_LOCAL_ACCESS_KEY: minioadmin
      MINIO_LOCAL_SECRET_KEY: minioadmin
      MINIO_LOCAL_BUCKET: archaeological-photos
      MINIO_LOCAL_SECURE: "false"
      CSRF_SECRET_KEY: "cambia-con-una-stringa-segreta-lunga"
      COOKIE_SAMESITE: "lax"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      - minio
    volumes:
      # Solo i dati persistenti — NON il codice sorgente
      - ./data:/app/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
